---
name: Release to the Puppet Forge

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

env:
  BUNDLE_WITHOUT: development

jobs:
  verify:
    name: 'Tag, syntax, lint & metadata'
    runs-on: ubuntu-latest
    env:
      PUPPET_GEM_VERSION: '~> 8.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Ruby
        uses: ruby/setup-ruby@824c0e29fdfc7d689c191c27acc969d2d04b7dd8 # v1.331.0
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Tag must match metadata.json's version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          metadata_version="$(ruby -rjson -e "puts JSON.parse(File.read('metadata.json'))['version']")"
          if [ "$tag_version" != "$metadata_version" ]; then
            echo "::error::Tag v${tag_version} does not match metadata.json version ${metadata_version}."
            exit 1
          fi

      - name: Syntax, lint, metadata and rubocop
        run: |
          bundle exec rake syntax
          bundle exec rake lint
          bundle exec rake metadata_lint
          bundle exec rake rubocop

  # Same Puppet/Ruby matrix as ci.yml, so a tag is never published without
  # having been tested on every Puppet version that metadata.json declares.
  # Kept out of the `release` job on purpose: that job is the only one that
  # runs in the `forge` environment and sees the Forge credentials.
  # The Windows jobs are not re-run here (issue #105): `verify_ci` below
  # gates the release on the `Test suite` check from ci.yml being green on
  # this commit, keeping forge isolation without re-running the expensive
  # Windows matrix.
  spec:
    name: 'rspec-puppet (Puppet ${{ matrix.puppet_version }}, Ruby ${{ matrix.ruby }})'
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - puppet_version: '~> 8.0'
            ruby: '3.2'
    env:
      PUPPET_GEM_VERSION: ${{ matrix.puppet_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Ruby
        uses: ruby/setup-ruby@824c0e29fdfc7d689c191c27acc969d2d04b7dd8 # v1.331.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: rspec-puppet
        run: bundle exec rake parallel_spec

  # Read-only gate (issue #105): a tag push does not run ci.yml, so verify
  # the `Test suite` check from ci.yml is green on this exact commit before
  # anything may publish. Runs before `release` and outside the `forge`
  # environment, so the publish job keeps its credential isolation without
  # re-running the expensive Windows matrix.
  verify_ci:
    name: 'CI Test suite is green'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
    steps:
      - name: Verify CI Test suite passed on this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SHA="$GITHUB_SHA"
          REPO="$GITHUB_REPOSITORY"
          gh api "repos/$REPO/commits/$SHA/check-runs?per_page=100" --paginate > /tmp/check-runs.jsonl
          echo '--- Test suite check runs on this commit ---'
          jq -s -r --arg sha "$SHA" '.[].check_runs[] | select(.name == "Test suite" and .head_sha == $sha) | "\(.status) \(.conclusion // "null") \(.html_url // "")"' /tmp/check-runs.jsonl || true
          count=$(jq -s --arg sha "$SHA" '[.[].check_runs[] | select(.name == "Test suite" and .head_sha == $sha and .status == "completed" and .conclusion == "success")] | length' /tmp/check-runs.jsonl)
          if [ "$count" -ge 1 ]; then
            echo "Found $count successful 'Test suite' check run(s) for commit $SHA."
            exit 0
          fi
          echo "::error::No successful 'Test suite' check run from ci.yml found for commit $SHA (fail-closed: in-progress, cancelled or superseded runs do not count). Push this commit to main and let CI go green, then move the tag onto the green commit before publishing."
          exit 1

  release:
    name: Publish to the Forge
    needs:
      - verify
      - spec
      - verify_ci
    runs-on: ubuntu-latest
    environment: forge
    env:
      PUPPET_GEM_VERSION: '~> 8.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Ruby
        uses: ruby/setup-ruby@824c0e29fdfc7d689c191c27acc969d2d04b7dd8 # v1.331.0
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Published tarball must equal the CI-tested tarball (issue #68)
        # Tag pushes do not run ci.yml, so release.yml re-verifies the
        # artifact it is about to publish (`verify_ci` above verifies the
        # Windows jobs are green instead of re-running them). Payload
        # equality with the `pdk build` tarball was proven by ci.yml on the
        # same commit.
        run: |
          set -e
          diff -u .pdkignore .pmtignore
          bundle exec rake module:build
          sh tools/check-tarball.sh pkg/*.tar.gz

      - name: Build and push to the Puppet Forge
        env:
          BLACKSMITH_FORGE_USERNAME: ${{ secrets.FORGE_USERNAME }}
          BLACKSMITH_FORGE_API_KEY: ${{ secrets.FORGE_API_KEY }}
        run: bundle exec rake module:push
