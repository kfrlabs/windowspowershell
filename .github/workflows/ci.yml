---
name: CI

on:
  pull_request: {}
  push:
    branches:
      - main
  schedule:
    # Weekly Gallery + upgrade + bracketed-repository validation (issue
    # #112): the only catalogue-apply runs allowed to reach the real
    # PowerShell Gallery or to need tags. Per-PR and push runs stay offline
    # apart from the PSScriptAnalyzer lint bootstrap (Install-Module in the
    # powershell jobs) and skip the schedule-only jobs below.
    - cron: '0 3 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUNDLE_WITHOUT: development

jobs:
  lint:
    name: 'Syntax, lint & metadata'
    runs-on: ubuntu-latest
    env:
      PUPPET_GEM_VERSION: '~> 8.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Ruby
        uses: ruby/setup-ruby@824c0e29fdfc7d689c191c27acc969d2d04b7dd8 # v1.331.0
        with:
          ruby-version: '3.2'
          bundler-cache: true
      - name: puppet parser validate (manifests, types)
        run: bundle exec rake syntax
      - name: puppet-lint
        run: bundle exec rake lint
      - name: metadata-json-lint
        run: bundle exec rake metadata_lint
      - name: rubocop
        run: bundle exec rake rubocop
      - name: Repo hygiene (symlinks, stray dotfiles, test fixtures)
        run: |
          bundle exec rake check:symlinks
          bundle exec rake check:git_ignore
          bundle exec rake check:dot_underscore
          bundle exec rake check:test_file
      - name: REFERENCE.md is up to date
        run: |
          bundle exec rake strings:generate:reference
          git diff --exit-code REFERENCE.md || \
            (echo '::error::REFERENCE.md is out of date. Run `bundle exec rake strings:generate:reference` and commit the result.' && exit 1)

  spec:
    name: 'rspec-puppet (Puppet ${{ matrix.puppet_version }}, Ruby ${{ matrix.ruby }})'
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - puppet_version: '~> 8.0'
            ruby: '3.2'
    env:
      PUPPET_GEM_VERSION: ${{ matrix.puppet_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Ruby
        uses: ruby/setup-ruby@824c0e29fdfc7d689c191c27acc969d2d04b7dd8 # v1.331.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: rspec-puppet
        run: bundle exec rake parallel_spec

  powershell:
    name: 'PowerShell: render, parse, PSScriptAnalyzer'
    needs: lint
    runs-on: ubuntu-latest
    env:
      PUPPET_GEM_VERSION: '~> 8.0'
      WPS_RENDER_DIR: ${{ github.workspace }}/.rendered-powershell
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Ruby
        uses: ruby/setup-ruby@824c0e29fdfc7d689c191c27acc969d2d04b7dd8 # v1.331.0
        with:
          ruby-version: '3.2'
          bundler-cache: true
      - name: Render the PowerShell the module generates
        run: |
          bundle exec rake spec_prep
          bundle exec rspec --pattern spec/unit/rendered_powershell_spec.rb
      - name: Parse and lint with PSScriptAnalyzer (PowerShell 7)
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          ./tools/Test-RenderedPowerShell.ps1 -Path .rendered-powershell, files, spec/integration/modules/wps_integration/files
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rendered-powershell
          path: .rendered-powershell
          include-hidden-files: true
          retention-days: 7

  powershell_windows:
    name: 'PowerShell on ${{ matrix.os }}'
    needs: powershell
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-2022
          - windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rendered-powershell
          path: .rendered-powershell
      - name: Parse and lint (Windows PowerShell 5.1)
        shell: powershell
        run: |
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          ./tools/Test-RenderedPowerShell.ps1 -Path .rendered-powershell, files, spec/integration/modules/wps_integration/files
      - name: Parse and lint (PowerShell 7)
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          ./tools/Test-RenderedPowerShell.ps1 -Path .rendered-powershell, files, spec/integration/modules/wps_integration/files
      - name: Runtime smoke test (Windows PowerShell 5.1)
        shell: powershell
        run: ./tools/Test-WindowsRuntime.ps1 -RenderedPath .rendered-powershell/runtime
      - name: Runtime smoke test (PowerShell 7, shared subset)
        # Issue #112, Gap 3: same offline replay through pwsh. The provider
        # itself only runs under 5.1, so this leg only proves the rendered
        # scripts are cross-edition clean (see TESTING.md).
        shell: pwsh
        run: ./tools/Test-WindowsRuntime.ps1 -RenderedPath .rendered-powershell/runtime -Shell pwsh

  integration_windows:
    name: 'Puppet apply on ${{ matrix.os }}'
    needs: powershell_windows
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-2022
          - windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Puppet agent 8
        shell: powershell
        run: |
          # Pinned: metadata.json requires puppet >= 8 < 9, so this must stay
          # on Puppet 8 even when the community feed offers a newer major.
          choco install puppet-agent --version 8.10.0 -y --no-progress
          'C:\Program Files\Puppet Labs\Puppet\bin' | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Stage the test modules
        shell: powershell
        run: |
          # The checkout is not on a modulepath and its directory name is not
          # guaranteed, so copy it under its module name next to the pinned
          # Forge dependencies (kept in sync with .fixtures.yml, issue #71) and
          # the wps_integration fixture module carrying the file sources.
          $staging = 'C:\wps-int\modules'
          New-Item -ItemType Directory -Path 'C:\wps-int' -Force | Out-Null
          New-Item -ItemType Directory -Path $staging -Force | Out-Null
          Copy-Item -Recurse -Force "$env:GITHUB_WORKSPACE" "$staging\windowspowershell"
          Copy-Item -Recurse -Force "$env:GITHUB_WORKSPACE\spec\integration\modules\wps_integration" "$staging\wps_integration"
          puppet module install puppetlabs-stdlib --version 9.7.0 --target-dir $staging
          puppet module install puppetlabs-concat --version 9.1.0 --target-dir $staging
          puppet module install puppetlabs-powershell --version 6.2.0 --target-dir $staging
      - name: Double puppet apply (second run must be clean)
        shell: powershell
        run: |
          Stop-Service puppet -ErrorAction SilentlyContinue
          ./tools/Test-PuppetApply.ps1 -Site spec/integration/site.pp -Modulepath 'C:\wps-int\modules'

  integration_repository_windows:
    name: 'Puppet apply (repository backend) on ${{ matrix.os }}'
    needs: powershell_windows
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-2022
          - windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Puppet agent 8
        shell: powershell
        run: |
          # Pinned: metadata.json requires puppet >= 8 < 9, so this must stay
          # on Puppet 8 even when the community feed offers a newer major.
          choco install puppet-agent --version 8.10.0 -y --no-progress
          'C:\Program Files\Puppet Labs\Puppet\bin' | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Stage the test modules
        shell: powershell
        run: |
          # Same staging as integration_windows: the checkout under its module
          # name next to the pinned Forge dependencies (see .fixtures.yml).
          $staging = 'C:\wps-int\modules'
          New-Item -ItemType Directory -Path 'C:\wps-int' -Force | Out-Null
          New-Item -ItemType Directory -Path $staging -Force | Out-Null
          Copy-Item -Recurse -Force "$env:GITHUB_WORKSPACE" "$staging\windowspowershell"
          puppet module install puppetlabs-stdlib --version 9.7.0 --target-dir $staging
          puppet module install puppetlabs-concat --version 9.1.0 --target-dir $staging
          puppet module install puppetlabs-powershell --version 6.2.0 --target-dir $staging
      - name: Repository backend apply twice (second run must be clean)
        shell: powershell
        run: |
          Stop-Service puppet -ErrorAction SilentlyContinue
          ./tools/Test-RepositoryBackend.ps1 -Site spec/integration/site_repository.pp -Modulepath 'C:\wps-int\modules'

  integration_repository_brackets_windows:
    # Issue #112, Gap 2 review: the bracketed publish path has zero Windows
    # evidence yet, so it stays out of the per-PR gate (and the `tests`
    # aggregator and release gate) until the first green run. Weekly only.
    name: 'Puppet apply (repository backend, brackets) on ${{ matrix.os }}'
    if: github.event_name == 'schedule'
    needs: powershell_windows
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-2022
          - windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Puppet agent 8
        shell: powershell
        run: |
          # Pinned: metadata.json requires puppet >= 8 < 9, so this must stay
          # on Puppet 8 even when the community feed offers a newer major.
          choco install puppet-agent --version 8.10.0 -y --no-progress
          'C:\Program Files\Puppet Labs\Puppet\bin' | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Stage the test modules
        shell: powershell
        run: |
          # Same staging as integration_repository_windows.
          $staging = 'C:\wps-int\modules'
          New-Item -ItemType Directory -Path 'C:\wps-int' -Force | Out-Null
          New-Item -ItemType Directory -Path $staging -Force | Out-Null
          Copy-Item -Recurse -Force "$env:GITHUB_WORKSPACE" "$staging\windowspowershell"
          puppet module install puppetlabs-stdlib --version 9.7.0 --target-dir $staging
          puppet module install puppetlabs-concat --version 9.1.0 --target-dir $staging
          puppet module install puppetlabs-powershell --version 6.2.0 --target-dir $staging
      - name: Repository backend with brackets apply twice (second run must be clean)
        shell: powershell
        run: |
          Stop-Service puppet -ErrorAction SilentlyContinue
          ./tools/Test-RepositoryBackend.ps1 -Site spec/integration/site_repository_brackets.pp -Modulepath 'C:\wps-int\modules' -IncludeBrackets

  integration_gallery_windows:
    # Issue #112, Gap 1: scheduled Gallery end-to-end test. Informational
    # only: it stays out of the `tests` aggregator and the release gate, and
    # it never runs on pull requests so per-PR jobs stay offline.
    name: 'Gallery backend (scheduled) on ${{ matrix.os }}'
    if: github.event_name == 'schedule'
    needs: powershell_windows
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-2022
          - windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Puppet agent 8
        shell: powershell
        run: |
          # Pinned: metadata.json requires puppet >= 8 < 9, so this must stay
          # on Puppet 8 even when the community feed offers a newer major.
          choco install puppet-agent --version 8.10.0 -y --no-progress
          'C:\Program Files\Puppet Labs\Puppet\bin' | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Stage the test modules
        shell: powershell
        run: |
          # Same staging as integration_windows: the checkout under its module
          # name next to the pinned Forge dependencies (see .fixtures.yml).
          $staging = 'C:\wps-int\modules'
          New-Item -ItemType Directory -Path 'C:\wps-int' -Force | Out-Null
          New-Item -ItemType Directory -Path $staging -Force | Out-Null
          Copy-Item -Recurse -Force "$env:GITHUB_WORKSPACE" "$staging\windowspowershell"
          puppet module install puppetlabs-stdlib --version 9.7.0 --target-dir $staging
          puppet module install puppetlabs-concat --version 9.1.0 --target-dir $staging
          puppet module install puppetlabs-powershell --version 6.2.0 --target-dir $staging
      - name: Gallery backend apply twice (second run must be clean)
        shell: powershell
        run: |
          Stop-Service puppet -ErrorAction SilentlyContinue
          ./tools/Test-GalleryBackend.ps1 -Site spec/integration/site_gallery.pp -Modulepath 'C:\wps-int\modules'

  integration_upgrade_windows:
    # Issue #112, Gap 4: scheduled upgrade scenario. Informational only: it
    # stays out of the `tests` aggregator and the release gate, and it never
    # runs on pull requests.
    name: 'Upgrade scenario (scheduled) on ${{ matrix.os }}'
    if: github.event_name == 'schedule'
    needs: powershell_windows
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-2022
          - windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The upgrade script checks out the previous tag and auto-derives
          # the newest v* tag: full history plus tags (cheap on the weekly
          # schedule).
          fetch-depth: 0
          fetch-tags: true
      - name: Install Puppet agent 8
        shell: powershell
        run: |
          # Pinned: metadata.json requires puppet >= 8 < 9, so this must stay
          # on Puppet 8 even when the community feed offers a newer major.
          choco install puppet-agent --version 8.10.0 -y --no-progress
          'C:\Program Files\Puppet Labs\Puppet\bin' | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Stage the test modules
        shell: powershell
        run: |
          # Same staging as integration_windows: the checkout under its module
          # name next to the pinned Forge dependencies (see .fixtures.yml) and
          # the wps_integration fixture module carrying the file sources.
          $staging = 'C:\wps-int\modules'
          New-Item -ItemType Directory -Path 'C:\wps-int' -Force | Out-Null
          New-Item -ItemType Directory -Path $staging -Force | Out-Null
          Copy-Item -Recurse -Force "$env:GITHUB_WORKSPACE" "$staging\windowspowershell"
          Copy-Item -Recurse -Force "$env:GITHUB_WORKSPACE\spec\integration\modules\wps_integration" "$staging\wps_integration"
          puppet module install puppetlabs-stdlib --version 9.7.0 --target-dir $staging
          puppet module install puppetlabs-concat --version 9.1.0 --target-dir $staging
          puppet module install puppetlabs-powershell --version 6.2.0 --target-dir $staging
      - name: Upgrade from the previous tag, then converge twice
        shell: powershell
        run: |
          Stop-Service puppet -ErrorAction SilentlyContinue
          ./tools/Test-Upgrade.ps1 -Site spec/integration/site.pp -Modulepath 'C:\wps-int\modules'

  module_build:
    name: 'puppet module build'
    needs: lint
    runs-on: ubuntu-latest
    env:
      PUPPET_GEM_VERSION: '~> 8.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Ruby
        uses: ruby/setup-ruby@824c0e29fdfc7d689c191c27acc969d2d04b7dd8 # v1.331.0
        with:
          ruby-version: '3.2'
          bundler-cache: true
      - name: Install PDK
        # `rake build` (puppetlabs_spec_helper) shells out to the `pdk`
        # binary, which the runner image does not ship. Keep the .deb out
        # of the workspace so `pdk build` cannot pack it (issue #68).
        run: |
          wget -q -P /tmp "https://apt.puppet.com/puppet-tools-release-$(lsb_release -cs).deb"
          sudo dpkg -i "/tmp/puppet-tools-release-$(lsb_release -cs).deb"
          sudo apt-get update -qq
          sudo apt-get install -y -qq pdk
      - name: .pmtignore must mirror .pdkignore (issue #68)
        # `pdk build` reads .pdkignore; blacksmith 8 (module:push) ships an
        # allowlisted payload and reads neither file, while legacy
        # `puppet module build` tooling reads .pmtignore. A drift here
        # means a builder could ship dev-only paths to the Forge.
        run: diff -u .pdkignore .pmtignore
      - name: Published payload must equal the tested payload (issue #68)
        run: |
          set -e
          pdk build
          tar -tzf pkg/*.tar.gz | sort > /tmp/pdk.list
          mv pkg/*.tar.gz /tmp/pdk-build.tar.gz
          bundle exec rake module:build
          tar -tzf pkg/*.tar.gz | sort > /tmp/puppet.list
          echo '--- pdk tarball (tested) ---'
          cat /tmp/pdk.list
          echo '--- blacksmith tarball (published to the Forge) ---'
          cat /tmp/puppet.list
          sh tools/check-tarball.sh /tmp/pdk-build.tar.gz
          sh tools/check-tarball.sh pkg/*.tar.gz
          mkdir -p /tmp/pdk-payload /tmp/puppet-payload
          tar -xzf /tmp/pdk-build.tar.gz -C /tmp/pdk-payload
          tar -xzf pkg/*.tar.gz -C /tmp/puppet-payload
          # pdk additionally ships its own dev files (spec/, Gemfile,
          # Rakefile); everything else must be byte-identical.
          diff -r -x spec -x Gemfile -x Rakefile \
            /tmp/pdk-payload/*/ /tmp/puppet-payload/*/ \
            && echo 'Payload identical.'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: module-package
          path: pkg/*.tar.gz
          retention-days: 7

  tests:
    name: Test suite
    needs:
      - lint
      - spec
      - powershell
      - powershell_windows
      - integration_windows
      - integration_repository_windows
      - module_build
    # The scheduled-only jobs (integration_gallery_windows,
    # integration_upgrade_windows, integration_repository_brackets_windows)
    # are informational and stay out of this
    # gate on purpose: they only run on the weekly schedule, and the release
    # gate requires this `Test suite` check green on the tagged commit.
    runs-on: ubuntu-latest
    steps:
      - run: echo 'All CI jobs passed.'
