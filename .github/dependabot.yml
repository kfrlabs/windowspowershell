---
version: 2
updates:
  # Keeps the commit SHAs that pin the actions in .github/workflows current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    labels:
      - ci
      - security
  - package-ecosystem: bundler
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    labels:
      - ci
      - security
