---
# Module data layer: ships neutral, working defaults only.
#
# Nothing is set here on purpose. The in-house module identity
# (`version`, `companyname`, `author`) is no longer a global
# setting: it is now declared per in-house module via
# `windowspowershell::module`, with neutral defaults baked into that
# defined type. Site-wide settings (`module_root`, `manage_profiles`,
# `manage_pwsh_profile`, `proxy`) already have working neutral defaults in
# `manifests/init.pp`.
#
# This file is kept as an extension point: a consuming control-repo can still
# layer its own module-data overrides on top of this hierarchy if it ever
# needs to, but this module itself ships none.
